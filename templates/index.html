<!DOCTYPE html>
<html>
<head>
    <title>Health Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        .section-upload {
            background: linear-gradient(135deg, #667eea22 0%, #764ba222 100%);
            border-left: 4px solid #667eea;
        }
        .section-analysis {
            background: linear-gradient(135deg, #f093fb22 0%, #f5576c22 100%);
            border-left: 4px solid #f093fb;
        }
        .navbar-custom {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navbar with User Info and Logout -->
    <nav class="navbar navbar-dark navbar-custom mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🩸 Lab Report Tracker</span>
            <div class="user-info">
                <div class="user-avatar" id="user-avatar">U</div>
                <span id="user-email" class="text-white" style="font-size: 14px;"></span>
                <button id="logout-btn" class="btn btn-light btn-sm">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="mb-4">📊 Your Health Dashboard</h2>
        
        <!-- SECTION 1: Upload New Reports -->
        <div class="card p-4 mb-5 section-upload">
            <h4 class="mb-3">📤 Upload New Lab Report</h4>
            <p class="text-muted mb-3">Upload a PDF lab report to extract and store results automatically</p>
            
            <form id="upload-form" enctype="multipart/form-data" class="d-flex gap-2 mb-3">
                <input type="file" name="file" class="form-control" accept=".pdf" required>
                <button type="submit" class="btn btn-primary px-4">Process</button>
            </form>
        </div>

        <!-- SECTION 2: Historical Analysis -->
        <div class="card p-4 mb-5 section-analysis">
            <h4 class="mb-3">📊 Historical Lab Analysis</h4>
            <p class="text-muted mb-3">View trends and get AI-powered insights for your lab parameters</p>
            
            <form class="mb-4">
                <label for="investigation-select" class="form-label fw-bold">Select Investigation:</label>
                <select id="investigation-select" class="form-select">
                    <option value="">-- Choose a parameter to view trend --</option>
                </select>
            </form>

            <div id="chart" style="min-height: 400px;"></div>
            
            <div id="analyze-btn-container" style="display: none;">
                <div class="mt-4">
                    <button id="analyze-btn" class="btn btn-success">🔍 Get Deeper Analysis</button>
                </div>
                <div id="analysis-card" class="card p-3 mt-3 d-none border-success">
                    <h5 class="mb-2 text-success">🤖 AI Assessment</h5>
                    <p id="analysis-summary" class="mb-2"></p>
                    <strong>Recommendations:</strong>
                    <ul id="analysis-tips" class="mb-0"></ul>
                </div>
            </div>
        </div>
    </div>
    
    <script type="application/json" id="graph-data">{{ graph_json | tojson }}</script>
    <script>
        // Initialize page when loaded
        window.addEventListener("load", async function () {
            // Display user email (passed from backend via session)
            const userEmail = "{{ session.get('email', 'User') }}";
            if (userEmail && userEmail !== 'User') {
                document.getElementById('user-email').textContent = userEmail;
                const avatar = document.getElementById('user-avatar');
                avatar.textContent = userEmail[0].toUpperCase();
            }
            
            // Load investigations
            await loadInvestigations();
        });

        // Logout functionality
        document.getElementById('logout-btn')?.addEventListener('click', function() {
            window.location.href = '/logout';
        });

        // Load investigations list
        async function loadInvestigations() {
            try {
                const response = await fetch('/api/investigations', {
                    method: 'GET'
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                if (response.ok && data.investigations) {
                    const select = document.getElementById('investigation-select');
                    data.investigations.forEach(inv => {
                        const option = document.createElement('option');
                        option.value = inv;
                        option.textContent = inv;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading investigations:', error);
            }
        }

        // Handle investigation selection
        document.getElementById('investigation-select')?.addEventListener('change', async function(e) {
            const investigationName = this.value;
            const analyzeBtn = document.getElementById('analyze-btn-container');
            
            if (!investigationName) {
                if (analyzeBtn) analyzeBtn.style.display = 'none';
                return;
            }

            try {
                const response = await fetch(`/api/investigation/${encodeURIComponent(investigationName)}`, {
                    method: 'GET'
                });

                if (response.status === 401) {
                    window.location.href = '/login';
                    return;
                }

                const data = await response.json();
                if (response.ok && data.graph) {
                    Plotly.newPlot('chart', data.graph.data, data.graph.layout || {});
                    if (analyzeBtn) analyzeBtn.style.display = 'block';
                    document.getElementById('analysis-card').classList.add('d-none');
                }
            } catch (error) {
                console.error('Error loading investigation data:', error);
            }
        });

        // Upload form handler
        document.getElementById('upload-form')?.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const btn = this.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Processing...';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (response.ok) {
                    alert('File processed successfully!');
                    window.location.href = '/dashboard';
                } else if (response.status === 401) {
                    alert('Session expired. Please login again.');
                    window.location.href = '/login';
                } else {
                    alert('Upload failed: ' + (result.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Error uploading file: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Process';
            }
        });

        // Analysis button
        (function() {
            var analyzeBtn = document.getElementById('analyze-btn');
            var card = document.getElementById('analysis-card');
            var summary = document.getElementById('analysis-summary');
            var tips = document.getElementById('analysis-tips');
            var select = document.getElementById('investigation-select');
            
            if (!analyzeBtn) {
                return;
            }

            analyzeBtn.addEventListener('click', function() {
                const selectedInvestigation = select?.value;
                if (!selectedInvestigation) {
                    alert('Please select an investigation first.');
                    return;
                }

                analyzeBtn.disabled = true;
                analyzeBtn.textContent = 'Analyzing...';
                if (summary) {
                    summary.textContent = '';
                }
                if (tips) {
                    tips.innerHTML = '';
                }

                fetch('/assessment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ investigation: selectedInvestigation })
                })
                .then(function(res) { 
                    if (res.status === 401) {
                        alert('Session expired. Please login again.');
                        window.location.href = '/login';
                        throw new Error('Unauthorized');
                    }
                    return res.json(); 
                })
                .then(function(data) {
                    if (data.error) {
                        throw new Error(data.error);
                    }
                    if (summary) {
                        summary.textContent = data.summary || 'No assessment returned.';
                    }
                    if (tips && Array.isArray(data.tips)) {
                        data.tips.forEach(function(line) {
                            var li = document.createElement('li');
                            li.textContent = line;
                            tips.appendChild(li);
                        });
                    }
                    if (card) {
                        card.classList.remove('d-none');
                    }
                })
                .catch(function(err) {
                    if (summary) {
                        summary.textContent = 'Could not generate analysis: ' + err.message;
                    }
                    if (card) {
                        card.classList.remove('d-none');
                    }
                })
                .finally(function() {
                    analyzeBtn.disabled = false;
                    analyzeBtn.textContent = '🔍 Get Deeper Analysis';
                });
            });
        })();
    </script>
</body>
</html>
